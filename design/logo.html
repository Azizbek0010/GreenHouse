<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f5f7; padding: 32px; }
  h3 { margin: 24px 0 12px; color: #16191d; }
  .row { display: flex; gap: 24px; align-items: center; }
  .lbl { font-size: 13px; color: #6b7077; margin-top: 8px; text-align: center; }

  /* ── Glyph: teplitsa + tulip ── */
  .badge { width: 160px; height: 160px; border-radius: 36px; display: flex; align-items: center; justify-content: center; }
  .navy  { background: #2c5282; }
  .white { background: #ffffff; border: 1px solid #e4e6ea; }

  /* render targets (exact pixel sizes, no border) */
  #icon1024  { width: 1024px; height: 1024px; border-radius: 0; background: #2c5282; display: flex; align-items: center; justify-content: center; }
  #fg1024    { width: 1024px; height: 1024px; background: transparent; display: flex; align-items: center; justify-content: center; }
  #bg1024    { width: 1024px; height: 1024px; background: #2c5282; }
  #mono1024  { width: 1024px; height: 1024px; background: transparent; display: flex; align-items: center; justify-content: center; }
  #splash1024{ width: 1024px; height: 1024px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; }
  #favicon48 { width: 48px; height: 48px; border-radius: 10px; background: #2c5282; display: flex; align-items: center; justify-content: center; }

  .wordmark { font-weight: 700; letter-spacing: -1px; color: #2c5282; }
</style>
</head>
<body>

<!-- glyph definition used everywhere -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="glyph">
      <!-- teplitsa korpusi -->
      <path d="M20,52 L60,24 L100,52 L100,96 L20,96 Z"
            fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- tom chizig'i (gorizontal to'sin) -->
      <line x1="20" y1="52" x2="100" y2="52" stroke-width="5" stroke-linecap="round"/>
      <!-- tulpan boshi -->
      <path d="M49,64 C49,76 54,81 60,81 C66,81 71,76 71,64 C67,69 63,68 60,62 C57,68 53,69 49,64 Z"
            stroke="none"/>
      <!-- poya -->
      <line x1="60" y1="81" x2="60" y2="92" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>
</svg>

<h3>A — нави-бейдж, белый глиф (рекомендую для иконки)</h3>
<div class="row">
  <div class="badge navy">
    <svg viewBox="0 0 120 120" width="116" height="116">
      <use href="#glyph" stroke="#fff" fill="#fff"/>
    </svg>
  </div>
</div>

<h3>B — белый бейдж, нави-контур + зелёный тюльпан</h3>
<div class="row">
  <div class="badge white">
    <svg viewBox="0 0 120 120" width="116" height="116">
      <g>
        <path d="M20,52 L60,24 L100,52 L100,96 L20,96 Z" fill="none" stroke="#2c5282" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
        <line x1="20" y1="52" x2="100" y2="52" stroke="#2c5282" stroke-width="5" stroke-linecap="round"/>
        <path d="M49,64 C49,76 54,81 60,81 C66,81 71,76 71,64 C67,69 63,68 60,62 C57,68 53,69 49,64 Z" fill="#1a8a4e"/>
        <line x1="60" y1="81" x2="60" y2="92" stroke="#1a8a4e" stroke-width="5" stroke-linecap="round"/>
      </g>
    </svg>
  </div>
</div>

<h3>C — глиф + вордмарк (для логина / сплэша)</h3>
<div class="row">
  <svg viewBox="0 0 120 120" width="72" height="72">
    <g>
      <path d="M20,52 L60,24 L100,52 L100,96 L20,96 Z" fill="none" stroke="#2c5282" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="20" y1="52" x2="100" y2="52" stroke="#2c5282" stroke-width="5" stroke-linecap="round"/>
      <path d="M49,64 C49,76 54,81 60,81 C66,81 71,76 71,64 C67,69 63,68 60,62 C57,68 53,69 49,64 Z" fill="#1a8a4e"/>
      <line x1="60" y1="81" x2="60" y2="92" stroke="#1a8a4e" stroke-width="5" stroke-linecap="round"/>
    </g>
  </svg>
  <div class="wordmark" style="font-size:44px">Greenhouse</div>
</div>

<h3>Render targets</h3>

<div id="icon1024">
  <svg viewBox="0 0 120 120" width="720" height="720">
    <use href="#glyph" stroke="#fff" fill="#fff"/>
  </svg>
</div>

<div id="fg1024">
  <svg viewBox="0 0 120 120" width="600" height="600">
    <use href="#glyph" stroke="#fff" fill="#fff"/>
  </svg>
</div>

<div id="bg1024"></div>

<div id="mono1024">
  <svg viewBox="0 0 120 120" width="600" height="600">
    <use href="#glyph" stroke="#fff" fill="#fff"/>
  </svg>
</div>

<div id="splash1024">
  <svg viewBox="0 0 120 120" width="420" height="420">
    <g>
      <path d="M20,52 L60,24 L100,52 L100,96 L20,96 Z" fill="none" stroke="#2c5282" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="20" y1="52" x2="100" y2="52" stroke="#2c5282" stroke-width="5" stroke-linecap="round"/>
      <path d="M49,64 C49,76 54,81 60,81 C66,81 71,76 71,64 C67,69 63,68 60,62 C57,68 53,69 49,64 Z" fill="#1a8a4e"/>
      <line x1="60" y1="81" x2="60" y2="92" stroke="#1a8a4e" stroke-width="5" stroke-linecap="round"/>
    </g>
  </svg>
  <div class="wordmark" style="font-size:96px">Greenhouse</div>
</div>

<div id="favicon48">
  <svg viewBox="0 0 120 120" width="40" height="40">
    <use href="#glyph" stroke="#fff" fill="#fff"/>
  </svg>
</div>

</body>
</html>
