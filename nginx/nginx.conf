events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 20m;

  upstream auth    { server auth:3001; }
  upstream partiya { server partiya:3002; }
  upstream sotuv   { server sotuv:3003; }
  upstream atxod   { server atxod:3004; }
  upstream stats   { server stats:3005; }
  upstream notify  { server notify:3006; }

  server {
    listen 8080;

    # Static uploads — shared volume
    location /uploads/ {
      alias /var/www/uploads/;
      expires 7d;
      add_header Cache-Control "public";
    }

    # Socket.io — notify service
    location /socket.io/ {
      proxy_pass         http://notify;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
    }

    # API routes
    location /api/auth/    { proxy_pass http://auth;    proxy_set_header Host $host; }
    location /api/partiya/ { proxy_pass http://partiya; proxy_set_header Host $host; }
    location /api/sotuv/   { proxy_pass http://sotuv;   proxy_set_header Host $host; }
    location /api/atxod/   { proxy_pass http://atxod;   proxy_set_header Host $host; }
    location /api/stats/   { proxy_pass http://stats;   proxy_set_header Host $host; }

    # Health check
    location /health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }
  }
}
